description: Nodal Industries, operating as Nodal Security, is a network security company
  and 500 Global portfolio startup that makes Numa, a plug-and-play network security appliance
  providing protective oversight of every connected device on a home or small-office network.
  Rather than per-device antivirus software, Numa works at the network layer, intercepting
  malicious traffic before it reaches devices using real-time threat intelligence powered by
  Suricata, with automatic updates and minimal setup. As of this enrichment pass the company
  publishes a marketing website only and exposes no public API, SDK, developer documentation,
  or event surface.
